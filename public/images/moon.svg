    />

    <circle
        cx="320"
        cy="230"
        r="42"
        fill="#EFCF95"
        opacity=".25"
    />

    <circle
        cx="220"
        cy="330"
        r="36"
        fill="#EFCF95"
        opacity=".30"
    />

    <circle
        cx="355"
        cy="135"
        r="20"
        fill="#F8E8BF"
        opacity=".25"
    />

</svg>