<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 512 512">

    <defs>

        <radialGradient id="moonGradient">

            <stop offset="0%" stop-color="#FFFDF7"/>

            <stop offset="60%" stop-color="#FFF4D6"/>

            <stop offset="100%" stop-color="#F5D79C"/>

        </radialGradient>

        <filter id="shadow">

            <feGaussianBlur stdDeviation="8"/>

        </filter>

    </defs>

    <circle
