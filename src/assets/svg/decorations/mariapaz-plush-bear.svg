<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">Osito Mariapaz</title>
  <desc id="desc">Osito de peluche tierno en estilo pastel, sentado con un lazo rosa.</desc>
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#FFF3E7"/><stop offset=".55" stop-color="#F7D9C8"/><stop offset="1" stop-color="#E9BCA8"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="0" y2="1">
