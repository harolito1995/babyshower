</filter>

</defs>

<g filter="url(#shadow)">

<circle cx="70" cy="105" r="48" fill="url(#leaf1)"/>

<circle cx="120" cy="78" r="56" fill="url(#leaf2)"/>

<circle cx="175" cy="102" r="52" fill="url(#leaf1)"/>

<circle cx="235" cy="88" r="46" fill="url(#leaf2)"/>

<circle cx="275" cy="110" r="36" fill="url(#leaf1)"/>

</g>

</svg>