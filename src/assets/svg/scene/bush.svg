<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 320 180"
fill="none">

<defs>

<radialGradient id="leaf1">
<stop offset="0%" stop-color="#DFF9D8"/>
<stop offset="100%" stop-color="#8BD19D"/>
</radialGradient>

<radialGradient id="leaf2">
<stop offset="0%" stop-color="#CFF3E0"/>
<stop offset="100%" stop-color="#79C694"/>
</radialGradient>

<filter id="shadow">
<feDropShadow
dx="0"
dy="5"
