<svg xmlns="http://www.w3.org/2000/svg"
viewBox="0 0 512 512"
fill="none">

<defs>

<radialGradient id="moon"

cx="40%"

cy="35%"

r="70%">

<stop offset="0%" stop-color="#FFFDF8"/>

<stop offset="45%" stop-color="#FFF4DA"/>

<stop offset="100%" stop-color="#FFE4B4"/>

</radialGradient>

<radialGradient id="halo">

<stop offset="0%" stop-color="#FFF5DD" stop-opacity=".55"/>

<stop offset="100%" stop-color="#FFF5DD" stop-opacity="0"/>

</radialGradient>

<filter id="shadow">

<feDropShadow

dx="0"

dy="0"

stdDeviation="18"

flood-color="#FFE9A8"

flood-opacity=".45"/>

</filter>

</defs>

<!-- Halo -->

<circle

cx="256"

cy="256"

r="210"

fill="url(#halo)"/>

<!-- Luna -->

<g filter="url(#shadow)">

<circle

cx="256"

cy="256"

r="140"

fill="url(#moon)"/>

<!-- Cráteres -->

<circle
cx="212"
cy="212"
r="16"
fill="#F8E7C4"
opacity=".55"/>

<circle
cx="312"
cy="188"
r="11"
fill="#F8E7C4"
opacity=".40"/>

<circle
cx="336"
cy="282"
r="18"
fill="#F8E7C4"
opacity=".38"/>

<circle
cx="188"
cy="314"
r="13"
fill="#F8E7C4"
opacity=".32"/>

<circle
cx="266"
cy="338"
r="8"
fill="#F8E7C4"
opacity=".45"/>

<!-- Brillo -->

<ellipse

cx="220"

cy="205"

rx="42"

ry="18"

fill="#FFFFFF"

opacity=".35"

transform="rotate(-28 220 205)"/>

</g>

</svg>